version: '3.8'

services:
    qlhssv_db:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: qlhssv_db
        environment:
            ACCEPT_EULA: "Y"
            MSSQL_SA_PASSWORD: "Ql_Hssv123"
        ports:
            - "1401:1433"
        volumes:
            - qlhssv_db_data:/var/opt/mssql
        restart: unless-stopped
        networks:
            - dbnet
        healthcheck:
            test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" >/dev/null 2>&1"]
            interval: 30s
            timeout: 10s
            retries: 5
        logging:
            driver: "json-file"
            options:    
                max-size: "10m"
                max-file: "3"

volumes:
    qlhssv_db_data:
        driver: local

networks:
    dbnet:
        driver: bridge
